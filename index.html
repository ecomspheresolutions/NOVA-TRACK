<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NOVA TRACK — personal digital wellbeing and productivity dashboard." />
  <title>NOVA TRACK</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">N</span><div><strong>NOVA</strong><small>TRACK</small></div></div>
      <nav>
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="goals">Goals</button>
        <button class="nav-item" data-view="habits">Habits</button>
        <button class="nav-item" data-view="focus">Focus</button>
        <button class="nav-item" data-view="analytics">Analytics</button>
        <button class="nav-item" data-view="achievements">Achievements</button>
      </nav>
      <button class="nav-item settings" data-view="settings">Settings</button>
    </aside>
    <main class="main">
      <header class="topbar"><div><p class="eyebrow">PERSONAL PRODUCTIVITY INTELLIGENCE</p><h1 id="page-title">Dashboard</h1></div><div class="date" id="today"></div></header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
